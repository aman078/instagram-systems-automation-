<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Systems Thinking - Instagram Carousel</title>
  <!-- Google Fonts: Newsreader (Warm Editorial Serif) + Plus Jakarta Sans + Caveat (Friendly Hand-drawn) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background-color: #F7F4EE; /* Soft warm textured parchment */
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #292524;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle paper texture overlay */
    .paper-texture {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.035;
      pointer-events: none;
      background-image: radial-gradient(#292524 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .container {
      width: 100%;
      height: 100%;
      padding: 68px 80px 58px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* Top Navigation / Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed rgba(60, 50, 40, 0.15);
      padding-bottom: 20px;
    }

    .series-tag {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #78716C;
    }

    .tag-pill {
      background: #EAE5D9;
      color: #44403C;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid rgba(60, 50, 40, 0.12);
    }

    .page-indicator {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 20px;
      font-weight: 600;
      color: #78716C;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 0 16px 0;
    }

    .cute-badge {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FED7AA;
      color: #9A3412;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid rgba(154, 52, 18, 0.2);
    }

    .title {
      font-family: 'Newsreader', serif;
      font-size: 56px;
      line-height: 1.14;
      font-weight: 700;
      color: #1C1917;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 24px;
      line-height: 1.4;
      color: #57534E;
      font-weight: 500;
      margin-bottom: 24px;
      max-width: 900px;
    }

    /* Note Card with paper-border styling */
    .note-card {
      background: #FFFDF9;
      border-radius: 24px;
      padding: 30px 34px;
      border: 1.5px solid #E7E2D6;
      box-shadow: 0 12px 32px rgba(60, 50, 40, 0.04), 0 2px 6px rgba(60, 50, 40, 0.03);
      position: relative;
    }

    /* Points list */
    .points-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .point-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .point-bubble {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #FFF7ED;
      border: 1.5px solid #FDBA74;
      color: #C2410C;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 17px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .point-text {
      font-size: 22px;
      line-height: 1.5;
      color: #292524;
    }

    .point-text strong {
      color: #1C1917;
      font-weight: 700;
    }

    /* Visual Explainer / Feedback Diagram */
    .diagram-card {
      margin: 4px 0;
      padding: 20px 22px;
      background: #FAF7F0;
      border: 1.5px dashed #D6CEBE;
      border-radius: 20px;
    }

    .diagram-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9A3412;
      background: #FFEDD5;
      padding: 4px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .diagram-chain {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .diagram-step {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      background: #FFFDF9;
      border: 1px solid #E7E0D3;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .diagram-step.highlight {
      background: #FEF3C7;
      border-color: #F59E0B;
    }

    .step-icon-bubble {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 1px solid #E5E0D8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .step-content {
      flex: 1;
    }

    .step-content .step-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #78716C;
      margin-bottom: 2px;
    }

    .step-content .step-title {
      font-size: 19px;
      font-weight: 700;
      color: #1C1917;
      line-height: 1.3;
    }

    .diagram-arrow {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      color: #C2410C;
      font-weight: bold;
      margin: -3px 0;
    }

    /* Hand-Drawn Margin Sticky Note */
    .sticky-note {
      margin-top: 24px;
      padding: 18px 24px;
      background: #FEF9C3; /* Soft warm post-it yellow */
      border: 1px dashed rgba(202, 138, 4, 0.4);
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: rotate(-0.5deg);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .sticky-text {
      font-family: 'Caveat', cursive;
      font-size: 25px;
      line-height: 1.25;
      color: #713F12;
    }

    /* Visual Continuity: The Stitched Trail Line */
    .trail-container {
      position: relative;
      height: 30px;
      margin-top: 24px;
      display: flex;
      align-items: center;
    }

    .trail-line {
      width: 100%;
      height: 2px;
      background: repeating-linear-gradient(90deg, #D6D3D1, #D6D3D1 8px, transparent 8px, transparent 16px);
      position: relative;
    }

    .trail-character {
      position: absolute;
      top: -16px;
      font-size: 24px;
      transition: all 0.3s ease;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 2px dashed rgba(60, 50, 40, 0.15);
      padding-top: 20px;
    }

    .handle {
      font-size: 15px;
      font-weight: 600;
      color: #78716C;
    }

    .next-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #C2410C;
    }
    .next-hint .arrow {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="paper-texture"></div>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="series-tag">
        <span class="tag-pill">🌱 Systems for Humans</span>
        <span>Chapter {{CHAPTER_NUM}}</span>
      </div>
      <div class="page-indicator">
        <span>{{CURRENT_SLIDE}}</span> of <span>{{TOTAL_SLIDES}}</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="cute-badge">{{SLIDE_TAG}}</div>
      <h1 class="title">{{SLIDE_TITLE}}</h1>
      <p class="subtitle">{{SLIDE_SUBTITLE}}</p>

      <div class="note-card">
        {{SLIDE_BODY}}
        {{SLIDE_TAKEAWAY}}
      </div>

      <!-- Seamless Continuity Thread with Walk-Along Character -->
      <div class="trail-container">
        <div class="trail-line"></div>
        <div class="trail-character" style="{{TRAIL_STYLE}}">{{TRAIL_ICON}}</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="handle">{{HANDLE}}</div>
      <div class="next-hint">
        {{FOOTER_ACTION}}
      </div>
    </div>
  </div>
</body>
</html>
