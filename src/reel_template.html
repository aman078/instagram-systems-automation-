<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 1080px;
      height: 1920px;
      background: radial-gradient(circle at 50% 20%, #151821 0%, #07080B 75%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 120px 80px 140px 80px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient background grid lines */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }

    /* Top Brand Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #E2E8F0;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 12px #10B981;
    }

    .category-badge {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #F59E0B;
    }

    /* Center Main Card */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 48px;
      position: relative;
      z-index: 2;
    }

    .hook-title {
      font-size: 76px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -1.5px;
      color: #FFFFFF;
    }

    .hook-title .highlight {
      color: #F59E0B;
      background: linear-gradient(120deg, #F59E0B 0%, #FBBF24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 34px;
      color: #94A3B8;
      line-height: 1.45;
      font-weight: 400;
    }

    /* Contrast Visual Box */
    .contrast-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 36px;
      padding: 44px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      backdrop-filter: blur(20px);
    }

    .contrast-row {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }

    .tag-bubble {
      flex-shrink: 0;
      padding: 10px 22px;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tag-bubble.intuition {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #FCA5A5;
    }

    .tag-bubble.reality {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6EE7B7;
    }

    .contrast-text {
      font-size: 30px;
      line-height: 1.4;
      color: #F1F5F9;
      font-weight: 500;
    }

    /* 3-Step Chain Reaction Diagram */
    .chain-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chain-step {
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px 32px;
    }

    .step-num {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #F59E0B;
      color: #FBBF24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .step-desc {
      font-size: 28px;
      font-weight: 600;
      color: #F8FAFC;
    }

    /* Bottom CTA */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 2;
    }

    .cta-text {
      font-size: 26px;
      font-weight: 600;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .audio-wave {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 28px;
    }

    .wave-bar {
      width: 5px;
      background: #F59E0B;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <!-- Top Header -->
  <div class="top-header">
    <div class="brand-pill">
      <div class="brand-dot"></div>
      <span>{{HANDLE}}</span>
    </div>
    <div class="category-badge">{{CATEGORY}}</div>
  </div>

  <!-- Center Content -->
  <div class="main-content">
    <h1 class="hook-title">{{HOOK_TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>

    <!-- Contrast Box -->
    <div class="contrast-box">
      <div class="contrast-row">
        <div class="tag-bubble intuition">{{LEFT_BADGE}}</div>
        <div class="contrast-text">{{LEFT_TEXT}}</div>
      </div>
      <div class="contrast-row">
        <div class="tag-bubble reality">{{RIGHT_BADGE}}</div>
        <div class="contrast-text">{{RIGHT_TEXT}}</div>
      </div>
    </div>

    <!-- 3-Step Reaction -->
    <div class="chain-container">
      {{CHAIN_STEPS}}
    </div>
  </div>

  <!-- Bottom CTA -->
  <div class="bottom-bar">
    <div class="cta-text">
      <span>💾</span>
      <span>Save this Reel for later</span>
    </div>
    <div class="audio-wave">
      <div class="wave-bar" style="height: 14px;"></div>
      <div class="wave-bar" style="height: 24px;"></div>
      <div class="wave-bar" style="height: 18px;"></div>
      <div class="wave-bar" style="height: 28px;"></div>
      <div class="wave-bar" style="height: 10px;"></div>
    </div>
  </div>
</body>
</html>
