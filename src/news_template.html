<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Decrypted - Breaking News Systems Breakdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background-color: #0B0D12; /* Deep Obsidian Slate */
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #F3F4F6;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle subtle technical dot grid overlay */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.04;
      pointer-events: none;
      background-image: radial-gradient(#FFFFFF 1.5px, transparent 1.5px);
      background-size: 32px 32px;
    }

    /* Ambient atmospheric glow */
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      opacity: 0.15;
    }
    .glow-top {
      top: -200px;
      right: -150px;
      background: #F59E0B; /* Electric Amber */
    }
    .glow-bottom {
      bottom: -200px;
      left: -150px;
      background: #3B82F6; /* Signal Blue */
    }

    .container {
      width: 100%;
      height: 100%;
      padding: 68px 80px 58px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* Top Technical Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 22px;
    }

    .radar-tag {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-pulse {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #F87171;
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 10px #EF4444;
    }

    .system-category {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #9CA3AF;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .page-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: #9CA3AF;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Main News Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 0 16px 0;
    }

    /* The News Hook Tag */
    .headline-pill {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #FBBF24;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 58px;
      line-height: 1.1;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }

    .title span.highlight {
      color: #F59E0B;
    }

    .subtitle {
      font-size: 24px;
      line-height: 1.45;
      color: #9CA3AF;
      font-weight: 500;
      margin-bottom: 24px;
      max-width: 900px;
    }

    /* High-contrast Technical Card Container */
    .intel-card {
      background: rgba(19, 23, 33, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      backdrop-filter: blur(12px);
    }

    /* Slide 1: The Micro-to-Macro Ripple Radar */
    .ripple-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 8px 0;
    }

    .ripple-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
    }

    .ripple-row.micro {
      border-left: 4px solid #3B82F6;
      background: rgba(59, 130, 246, 0.05);
    }
    .ripple-row.meso {
      border-left: 4px solid #F59E0B;
      background: rgba(245, 158, 11, 0.05);
    }
    .ripple-row.macro {
      border-left: 4px solid #EC4899;
      background: rgba(236, 72, 153, 0.05);
    }

    .level-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      min-width: 90px;
      text-align: center;
    }
    .ripple-row.micro .level-tag { background: rgba(59, 130, 246, 0.2); color: #93C5FD; }
    .ripple-row.meso .level-tag { background: rgba(245, 158, 11, 0.2); color: #FCD34D; }
    .ripple-row.macro .level-tag { background: rgba(236, 72, 153, 0.2); color: #F472B6; }

    .ripple-text {
      flex: 1;
      font-size: 18px;
      line-height: 1.35;
      color: #E5E7EB;
      font-weight: 600;
    }

    .ripple-text strong {
      color: #FFFFFF;
      font-weight: 800;
    }

    /* General Points List for News Narrative */
    .news-points {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-point-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .news-point-num {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #FBBF24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .news-point-text {
      font-size: 21px;
      line-height: 1.48;
      color: #D1D5DB;
    }

    .news-point-text strong {
      color: #FFFFFF;
      font-weight: 700;
    }

    /* System Shockwave Box (Slide 4 / 5) */
    .shockwave-banner {
      margin-top: 22px;
      padding: 16px 20px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .shockwave-icon {
      font-size: 28px;
    }

    .shockwave-text {
      font-size: 18px;
      line-height: 1.35;
      color: #FDE68A;
      font-weight: 600;
    }

    .shockwave-text strong {
      color: #FFFFFF;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
    }

    .handle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: #6B7280;
    }

    .next-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: #F59E0B;
    }
    .next-hint .arrow {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <div class="container">
    <!-- Top Header -->
    <div class="header">
      <div class="radar-tag">
        <div class="live-pulse">
          <span class="pulse-dot"></span>
          <span>SYSTEM RADAR</span>
        </div>
        <span class="system-category">{{CATEGORY}}</span>
      </div>
      <div class="page-indicator">
        <span>{{CURRENT_SLIDE}}</span> / <span>{{TOTAL_SLIDES}}</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="headline-pill">{{HEADLINE_TAG}}</div>
      <h1 class="title">{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>

      <div class="intel-card">
        {{CARD_BODY}}
        {{SHOCKWAVE_BANNER}}
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="handle">{{HANDLE}}</div>
      <div class="next-hint">
        {{FOOTER_ACTION}}
      </div>
    </div>
  </div>
</body>
</html>
