name: Daily Top-20 Comment Radar

on:
  schedule:
    # 10:30 AM IST is 5:00 AM UTC (Mon through Fri, peak morning engagement time)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch_radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Comment Radar & Dispatch to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/comment_radar_trigger.js

