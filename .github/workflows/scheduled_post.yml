name: Scheduled Systems Thinking Post

on:
  schedule:
    # 8:30 AM IST is 3:00 AM UTC (Mon, Wed, Fri)
    - cron: '0 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      auto_publish:
        description: 'Auto-publish directly to Instagram (Autopilot mode)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate_and_dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Chrome dependencies for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run Post Generator & Push to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_HANDLE: ${{ secrets.INSTAGRAM_HANDLE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          AUTO_PUBLISH: ${{ github.event.inputs.auto_publish || vars.AUTO_PUBLISH }}
        run: node src/cron_trigger.js

      - name: Save Post History and Cloud Staging
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/cloud_staged.json history.json autopilot.json publish_log.json || true
          git commit -m "chore: record post history, staging, and autopilot state [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
